name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'
      - 'repo.json'
      - 'DomainCheck.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21 (Gradle daemon / AGP)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (library toolchain)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Guard against stale daemon JVM pin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          rm -f $GITHUB_WORKSPACE/src/gradle/gradle-daemon-jvm.properties
          if grep -q "^org.gradle.java.home=" $GITHUB_WORKSPACE/src/gradle.properties; then
            sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME_21_X64|" $GITHUB_WORKSPACE/src/gradle.properties
          else
            echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> $GITHUB_WORKSPACE/src/gradle.properties
          fi
          echo "Daemon JDK: $JAVA_HOME_21_X64"
          "$JAVA_HOME_21_X64/bin/java" -version
          echo "Toolchain JDK 17: $JAVA_HOME_17_X64"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Force fresh Gradle Plugin
        run: rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Plugins
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          ORG_GRADLE_PROJECT_orgGradleJavaHome: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds || true

      - name: Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin builds --force
